name: Build stock-watch

on:
  push:
    paths:
      - "stock-watch/**"
      - ".github/workflows/stock-watch.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build phone and watch apps
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :mobile:assembleDebug :wear:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: stock-watch-apks
          path: |
            stock-watch/mobile/build/outputs/apk/debug/*.apk
            stock-watch/wear/build/outputs/apk/debug/*.apk
